name: Build and Push Image

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: 'mels1747/simple-nodejs-app'

    steps: 
      - name: Chechout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get Commit Hash
        id: vars
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }} .


  approval:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for manual approval
        uses: chrnorm/seploy-approval-actions@v1.0
        with:
          requires: |
            username-input
            password-input

  push:
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Log in to Docker Hub
        run: |
          echo "Please log in to Docker Hub manually."
          read -p 'Docker Hub Username: ' USERNAME
          read -sp 'Docker Hub Password: ' PASSWORD
          echo
          echo "$PASSWORD" | docker login -u "$USERNAME" --password-stdin


      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }}
