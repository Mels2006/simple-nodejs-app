name: Build and Push Docker Image with Approval

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: 'mels1747/simple-nodejs-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get commit hash
        id: vars
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }} .

  push:
    runs-on: ubuntu-latest
    needs: build
    environment: production  
    steps:
      - name: Log in to Docker Hub
        run: |
          echo "Please log in to Docker Hub manually."
          read -p 'Docker Hub Username: ' USERNAME
          read -sp 'Docker Hub Password: ' PASSWORD
          echo
          echo "$PASSWORD" | docker login -u "$USERNAME" --password-stdin

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }}
