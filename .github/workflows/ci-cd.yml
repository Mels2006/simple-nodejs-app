name: Build and Push Docker Image with Approval

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: 'mels1747/simple-nodejs-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get commit hash
        id: vars
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD || echo "latest")
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "Commit hash: ${COMMIT_HASH}"

      - name: Build Docker image
        run: |
          echo "Building Docker image with tag: ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }}"
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }} .
          echo "Docker images available:"
          docker images

  push:
    runs-on: ubuntu-latest
    needs: build
    environment: production  
    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Verify Docker Image
        run: |
          echo "Checking Docker images before pushing:"
          docker images

      - name: Debug Environment Variables
        run: |
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          echo "COMMIT_HASH=${{ env.COMMIT_HASH }}"

      - name: Push Docker image
        run: |
          echo "Pushing Docker image: ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }}"
          docker push ${{ env.IMAGE_NAME }}:${{ env.COMMIT_HASH }}
